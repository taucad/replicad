name: "Publish"

# Publishes one workspace package to npm under the @taulabs scope through npm
# trusted publishing (OIDC): no token is stored. Runs only by hand from main,
# so every release is a deliberate choice.
on:
  workflow_dispatch:
    inputs:
      package:
        description: "Workspace package to publish"
        required: true
        default: "@taulabs/replicad"
        type: choice
        options:
          - "@taulabs/replicad"
      tag:
        description: "npm dist-tag"
        required: true
        default: "latest"
        type: string

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Update npm
        run: npm install --global npm@^11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm prepare-packages

      - name: Test
        run: pnpm --filter "${{ inputs.package }}" test

      # pnpm pack rewrites workspace: ranges; npm publishes the tarball with an
      # OIDC token and attaches provenance automatically.
      - name: Pack
        run: |
          case "$PACKAGE" in
            "@taulabs/replicad") dir=packages/replicad ;;
            *) echo "no directory for $PACKAGE" >&2; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/pack"
          (cd "$dir" && pnpm pack --pack-destination "$RUNNER_TEMP/pack")
        env:
          PACKAGE: ${{ inputs.package }}

      - name: Publish
        run: npm publish "$RUNNER_TEMP"/pack/*.tgz --access public --tag "$NPM_TAG"
        env:
          NPM_TAG: ${{ inputs.tag }}
