name: "Publish pages"

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]

jobs:
  publish-studio:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm prepare-packages

      # Runs after the build: replicad-evaluator and replicad-cli resolve
      # replicad through its published entry points, so they need dist/.
      - name: Run the tests
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build the studio
        run: pnpm --filter studio build

      - name: Build the example app
        run: pnpm --filter replicad-app-example build

      - name: Publish the studio
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_ACCESS }}
          accountId: d0e0387dd16b671a301d1ce6e7b73609
          projectName: replicad-studio
          directory: packages/studio/dist
          wranglerVersion: "3"

      - name: Publish the example app
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_ACCESS }}
          accountId: d0e0387dd16b671a301d1ce6e7b73609
          projectName: replicad-example-app
          directory: packages/replicad-app-example/build
          wranglerVersion: "3"
